<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{% block title %}meshwatch{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css?v={{ version }}">
<script src="/static/htmx-2.0.4.min.js" defer></script>
<script src="/static/app.js?v={{ version }}" defer></script>
{% block head %}{% endblock %}
</head>
<body>
{% block nav %}
<header class="top">
  <a class="brand" href="/">meshwatch</a>
  <nav>
    <a href="/">Nodes</a>
    <a href="/map">Map</a>
    <a href="/fleet">Fleet</a>
    <a href="/console">Console</a>
    <a href="/add">Add</a>
    <a href="/alerts">Alerts{% if open_alerts %} <span class="badge bad">{{ open_alerts }}</span>{% endif %}</a>
    <a href="/audit">Audit</a>
    <a href="/settings">Settings</a>
  </nav>
  <span class="radio-state {{ radio.state }}" title="Companion radio: {{ radio.state }}{% if radio.error %} — {{ radio.error }}{% endif %}">● radio</span>
</header>
{% endblock %}
<main>
{% block content %}{% endblock %}
</main>
<footer class="muted">meshwatch {{ version }}</footer>
</body>
</html>
